default_language_version:
  python: python3.12
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=750']
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # mypy runs as a dedicated CI job (`Typecheck`) and via `make typecheck`,
  # both inside the synced project venv where every runtime dep resolves.
  # Running it via mirrors-mypy in pre-commit's isolated env requires
  # mirroring the entire runtime dep list in `additional_dependencies`,
  # which drifts from pyproject.toml in practice. Keep mypy out of the
  # hook chain and trust the dedicated job.

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, -r, src]
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.22.0
    hooks:
      - id: gitleaks
