version: 2
# pip + docker ecosystems are managed by Renovate (see ../renovate.json5).
# Dependabot's pip ecosystem cannot reconcile uv.lock; CI's `uv sync --frozen`
# would reject any unreconciled PR. Renovate's `postUpdateOptions: ["uvLockFile"]`
# regenerates the lockfile alongside each update.
#
# Keep github-actions here for first-class GitHub security advisory integration.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
