name: gitleaks

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    name: Gitleaks scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
