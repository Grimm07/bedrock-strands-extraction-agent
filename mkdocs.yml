site_name: bedrock-strands-agent
site_description: Form-extraction agent built on Strands + Amazon Bedrock.
site_url: https://your-org.github.io/bedrock-strands-agent/
repo_url: https://github.com/your-org/bedrock-strands-agent
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight

exclude_docs: |
  adr/template.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Technology stack: tech-stack.md
  - Roadmap: ROADMAP.md
  - Contributing: CONTRIBUTING.md
  - Extraction modes: extraction-modes.md
  - Service Level Objectives: slos.md
  - Architecture decisions:
      - Index: adr/README.md
      - "0001 — Strands SDK": adr/0001-strands-sdk-over-langchain.md
      - "0002 — Schema-first extraction": adr/0002-schema-first-extraction-with-self-correcting-retry.md
      - "0003 — AgentCore deployment (proposed)": adr/0003-agentcore-full-platform-deployment.md
      - "0004 — Confidence calibration": adr/0004-confidence-calibration.md
      - "0005 — Bedrock as default provider": adr/0005-bedrock-as-default-provider.md
      - "0006 — JSON-only response contract": adr/0006-json-only-response-contract.md
      - "0007 — MCP-as-tools": adr/0007-mcp-as-tools.md
      - "0008 — Text vs vision extraction modes": adr/0008-extraction-modes-text-vs-vision.md
      - "0009 — Bounded self-correcting retry": adr/0009-bounded-self-correcting-retry.md
      - "0010 — ≥85% coverage gate": adr/0010-coverage-gate-85.md
      - "0011 — Prompt-injection threat model": adr/0011-prompt-injection-threat-model.md
  - Runbooks:
      - On-call: runbooks/oncall.md
      - Bedrock throttling: runbooks/bedrock-throttling.md
      - /extract 502 spike: runbooks/extraction-error-spike.md
      - Auth misconfig: runbooks/auth-misconfig.md
  - API reference: api.md
